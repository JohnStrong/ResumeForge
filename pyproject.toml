[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeforge"
version = "0.1.0"
description = "Convert plain-text CVs into styled A4 PDFs using RCSS"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["lark"]

[project.scripts]
resumeforge = "resumeforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
